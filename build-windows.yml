name: Build MARKYS PDV Windows
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Resolve dependencies
        run: go mod tidy
      - name: Validate embedded JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          html = Path("cmd/pdv/web/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', html, flags=re.IGNORECASE | re.DOTALL)
          if not scripts:
              raise SystemExit("Nenhum script inline encontrado em index.html")
          for index, script in enumerate(scripts):
              path = Path(f"/tmp/markys-inline-{index}.js")
              path.write_text(script, encoding="utf-8")
              subprocess.run(["node", "--check", str(path)], check=True)
          print(f"JavaScript validado: {len(scripts)} bloco(s)")
          PY
      - name: Test
        run: go test ./...
      - name: Prepare application icon from the saved logo
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          go install github.com/akavel/rsrc@latest
          mkdir -p dist/pacote
          convert cmd/pdv/web/logo.png -define icon:auto-resize=256,128,64,48,32,16 dist/MARKYS-PDV.ico
          "$(go env GOPATH)/bin/rsrc" -arch amd64 -ico dist/MARKYS-PDV.ico -o cmd/pdv/rsrc_windows_amd64.syso
      - name: Build Windows x64
        env:
          CGO_ENABLED: 0
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -trimpath -ldflags="-s -w" -o dist/pacote/MARKYS-PDV-windows-amd64.exe ./cmd/pdv
      - name: Assemble Windows package files
        run: |
          cp deploy/windows/INICIAR-MARKYS-PDV.bat dist/pacote/
          cp deploy/windows/LEIA-ME.txt dist/pacote/
          cp dist/MARKYS-PDV.ico dist/pacote/
      - uses: actions/upload-artifact@v4
        with:
          name: MARKYS-PDV-Windows-x64
          path: dist/pacote/
          if-no-files-found: error
