<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MARKYS · Orçamentos</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#121d30;--line:#293951;--muted:#9aaac0;--text:#edf3fb;--blue:#60a5fa;--green:#34d399}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,Segoe UI,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 22px;background:#101a2b;border-bottom:1px solid var(--line)}
header strong{font-size:17px;letter-spacing:.4px}
a{color:var(--blue);text-decoration:none}
.wrap{max-width:1220px;margin:auto;padding:18px;display:grid;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-size:21px;margin:0}
h2{font-size:15px;margin:0 0 12px}
.muted,label{color:var(--muted)}
.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(270px,.75fr);gap:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px;min-width:0}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.field{display:grid;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
label{font-size:11px}
input,select,textarea{width:100%;min-width:0;padding:9px 10px;border-radius:7px;border:1px solid #34445d;background:#0b1424;color:var(--text);font:inherit}
textarea{min-height:62px;resize:vertical}
button{border:0;border-radius:7px;padding:9px 12px;background:#2563eb;color:white;font-weight:700;cursor:pointer}
button.secondary{background:#2a3a52}
button.good{background:#047857}
button.danger{background:#991b1b}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:530px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
th{font-size:10px;color:var(--muted);text-transform:uppercase}
td input{min-width:65px;padding:7px}
.total{text-align:right;font-size:13px;line-height:1.8;margin:10px 0 0}
.total strong{font-size:21px}
.status{min-height:17px;color:#fca5a5;font-size:12px;margin-top:8px}
.quote-list{display:grid;gap:7px;max-height:590px;overflow:auto}
.quote{border:1px solid var(--line);border-radius:9px;padding:10px;display:grid;gap:6px}
.quote-head{display:flex;justify-content:space-between;gap:8px}
.pill{font-size:10px;padding:3px 7px;border-radius:20px;background:#24354c;color:#bfdbfe}
.quote button{padding:6px 8px;font-size:11px}
.section-gap{margin-top:17px}
@media(max-width:850px){.layout{grid-template-columns:1fr}}
@media(max-width:520px){.wrap{padding:10px}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}header{padding:12px}}
@media print{body{background:white;color:#111}header,.no-print,.status{display:none!important}.wrap{max-width:none;padding:0}.panel{background:white;border:0;color:#111;padding:0}.layout{display:block}input,select,textarea{border:0;background:white;color:#111;padding:0}.table-wrap{overflow:visible}table{min-width:0}th,td{border-color:#ddd}.muted,label{color:#555}.section-gap{margin-top:12px}}
</style>
</head>
<body>
<header><strong>MARKYS <span style="color:#60a5fa">· ORÇAMENTOS</span></strong><a href="/">← Voltar ao PDV</a></header>
<main class="wrap">
  <div class="top">
    <h1>Orçamentos</h1>
    <div class="actions no-print">
      <button class="secondary" id="newBtn">Novo</button>
      <button id="saveBtn">Salvar orçamento</button>
      <button class="secondary" id="printBtn">Imprimir / PDF</button>
    </div>
  </div>
  <div class="layout">
    <section class="panel" id="editor">
      <h2>Cliente</h2>
      <div class="fields">
        <div class="field full"><label>Cliente cadastrado</label><select id="customerSelect"><option value="0">Preencher manualmente</option></select></div>
        <div class="field"><label>Nome / Razão social *</label><input id="customerName" maxlength="160" placeholder="Nome do cliente"></div>
        <div class="field"><label>CPF / CNPJ</label><input id="customerDocument" maxlength="30"></div>
        <div class="field"><label>Telefone</label><input id="customerPhone" maxlength="40"></div>
        <div class="field"><label>Endereço</label><input id="customerAddress" maxlength="300"></div>
      </div>

      <h2 class="section-gap">Itens</h2>
      <div class="fields no-print" style="margin-bottom:9px">
        <div class="field"><label>Produto cadastrado</label><select id="productSelect"><option value="">Selecione um produto</option></select></div>
        <div class="field" style="align-self:end"><button class="secondary" id="addProduct">Adicionar item</button></div>
      </div>
      <div class="table-wrap">
        <table><thead><tr><th>Descrição</th><th>Qtd.</th><th>Un.</th><th>Preço unit.</th><th>Total</th><th class="no-print"> </th></tr></thead>
        <tbody id="items"><tr><td colspan="6" class="muted">Nenhum item adicionado.</td></tr></tbody></table>
      </div>

      <div class="fields section-gap">
        <div class="field"><label>Validade</label><input id="validUntil" type="date"></div>
        <div class="field"><label>Desconto (R$)</label><input id="discount" type="number" min="0" step=".01" value="0"></div>
        <div class="field full"><label>Observações</label><textarea id="notes" maxlength="2000" placeholder="Condições comerciais, prazo de entrega..."></textarea></div>
      </div>
      <div class="total">Subtotal: <span id="subtotal">R$ 0,00</span><br>Desconto: <span id="discountView">R$ 0,00</span><br><strong>Total: <span id="total">R$ 0,00</span></strong></div>
      <div class="status" id="message" role="status"></div>
    </section>

    <aside class="panel no-print">
      <h2>Histórico</h2>
      <input id="quoteSearch" placeholder="Buscar número ou cliente" style="margin-bottom:9px">
      <div class="quote-list" id="quoteList"><div class="muted">Carregando...</div></div>
    </aside>
  </div>
</main>
<script>
const $=s=>document.querySelector(s),brl=c=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format((Number(c)||0)/100),cents=v=>Math.round((Number(v)||0)*100),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let products=[],customers=[],quotes=[],items=[];
async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||data.message||'Não foi possível concluir a operação.');return data}
function renderItems(){
 const body=$('#items');
 if(!items.length)body.innerHTML='<tr><td colspan="6" class="muted">Nenhum item adicionado.</td></tr>';
 else body.innerHTML=items.map((it,i)=>'<tr><td><input data-i="'+i+'" data-k="name" value="'+esc(it.name)+'"></td><td><input data-i="'+i+'" data-k="quantity" type="number" min=".001" step=".001" value="'+it.quantity+'"></td><td><input data-i="'+i+'" data-k="unit" value="'+esc(it.unit||'UN')+'"></td><td><input data-i="'+i+'" data-k="price" type="number" min="0" step=".01" value="'+(it.unit_price_cents/100).toFixed(2)+'"></td><td>'+brl(it.quantity*it.unit_price_cents)+'</td><td class="no-print"><button class="danger" data-remove="'+i+'">Remover</button></td></tr>').join('');
 body.querySelectorAll('input').forEach(el=>el.addEventListener('change',()=>{const i=Number(el.dataset.i),k=el.dataset.k;if(k==='price')items[i].unit_price_cents=cents(el.value);else if(k==='quantity')items[i].quantity=Math.max(.001,Number(el.value)||.001);else items[i][k]=el.value;renderItems()}));
 body.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click',()=>{items.splice(Number(b.dataset.remove),1);renderItems()}));
 calc();
}
function calc(){const sub=items.reduce((a,x)=>a+Math.round(x.quantity*x.unit_price_cents),0),d=Math.min(sub,Math.max(0,cents($('#discount').value)));$('#subtotal').textContent=brl(sub);$('#discountView').textContent=brl(d);$('#total').textContent=brl(sub-d)}
function reset(){items=[];['customerName','customerDocument','customerPhone','customerAddress','notes'].forEach(id=>$('#'+id).value='');$('#customerSelect').value='0';$('#discount').value='0';$('#validUntil').value='';$('#message').textContent='';renderItems()}
function fillCustomer(){const c=customers.find(x=>x.id===Number($('#customerSelect').value));if(!c)return;$('#customerName').value=c.name;$('#customerDocument').value=c.document||'';$('#customerPhone').value=c.phone||'';$('#customerAddress').value=c.address||''}
async function save(){
 $('#message').textContent='';
 if(!$('#customerName').value.trim()){ $('#message').textContent='Informe o nome do cliente.';return }
 if(!items.length){ $('#message').textContent='Adicione pelo menos um item.';return }
 try{
  const payload={customer_id:Number($('#customerSelect').value)||0,customer_name:$('#customerName').value.trim(),customer_document:$('#customerDocument').value.trim(),customer_phone:$('#customerPhone').value.trim(),customer_address:$('#customerAddress').value.trim(),items:items.map(x=>({product_id:x.product_id||0,code:x.code||'',name:x.name,unit:x.unit,quantity:Number(x.quantity),unit_price_cents:Number(x.unit_price_cents)})),discount_cents:cents($('#discount').value),valid_until:$('#validUntil').value,notes:$('#notes').value};
  await api('/api/quotes',{method:'POST',body:JSON.stringify(payload)});
  await loadQuotes();
  reset();
 }catch(e){$('#message').textContent=e.message}
}
async function loadQuotes(){quotes=await api('/api/quotes');renderQuotes()}
function renderQuotes(){
 const q=$('#quoteSearch').value.toLocaleLowerCase('pt-BR'),list=quotes.filter(x=>(x.number+' '+x.customer_name).toLocaleLowerCase('pt-BR').includes(q));
 $('#quoteList').innerHTML=list.length?list.map(x=>'<div class="quote"><div class="quote-head"><b>'+esc(x.number)+'</b><span class="pill">'+esc(({pending:'Pendente',approved:'Aprovado',rejected:'Recusado',expired:'Expirado'})[x.status]||x.status)+'</span></div><div>'+esc(x.customer_name)+'</div><b>'+brl(x.total_cents)+'</b><div class="actions"><button class="secondary" data-open="'+x.id+'">Abrir / PDF</button>'+(x.status==='pending'?'<button class="good" data-status="approved" data-id="'+x.id+'">Aprovar</button><button class="danger" data-status="rejected" data-id="'+x.id+'">Recusar</button>':'')+'</div></div>').join(''):'<div class="muted">Nenhum orçamento encontrado.</div>';
 list.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openQuote(Number(b.dataset.open)));
 list.querySelectorAll('[data-status]').forEach(b=>b.onclick=async()=>{try{await api('/api/quotes?id='+b.dataset.id,{method:'PATCH',body:JSON.stringify({status:b.dataset.status})});await loadQuotes()}catch(e){$('#message').textContent=e.message}});
}
async function openQuote(id){
 try{const q=await api('/api/quotes?id='+id);reset();$('#customerName').value=q.customer_name;$('#customerDocument').value=q.customer_document;$('#customerPhone').value=q.customer_phone;$('#customerAddress').value=q.customer_address;$('#validUntil').value=q.valid_until;$('#notes').value=q.notes;$('#discount').value=(q.discount_cents/100).toFixed(2);items=q.items.map(x=>({...x}));renderItems();window.scrollTo({top:0,behavior:'smooth'});setTimeout(()=>window.print(),150)}
 catch(e){$('#message').textContent=e.message}
}
async function init(){
 try{
  [products,customers]=await Promise.all([api('/api/products'),api('/api/customers')]);
  $('#productSelect').innerHTML='<option value="">Selecione um produto</option>'+products.filter(p=>p.active).map(p=>'<option value="'+p.id+'">'+esc(p.code+' · '+p.name)+' — '+brl(p.price_cents)+'</option>').join('');
  $('#customerSelect').innerHTML='<option value="0">Preencher manualmente</option>'+customers.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('');
  await loadQuotes();
 }catch(e){$('#message').textContent='Falha ao carregar os dados: '+e.message}
}
$('#addProduct').onclick=()=>{const p=products.find(x=>x.id===Number($('#productSelect').value));if(!p)return;items.push({product_id:p.id,code:p.code,name:p.name,unit:p.unit,quantity:1,unit_price_cents:p.price_cents});renderItems()};
$('#customerSelect').onchange=fillCustomer;
$('#discount').oninput=calc;
$('#saveBtn').onclick=save;
$('#newBtn').onclick=reset;
$('#printBtn').onclick=()=>window.print();
$('#quoteSearch').oninput=renderQuotes;
init();renderItems();
</script>
</body>
</html>
