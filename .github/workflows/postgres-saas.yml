name: MARKYS PDV PostgreSQL SaaS foundation
on:
  push:
    branches: [feature/markys-pdv-online]
    paths:
      - "migrations/postgres/**"
      - ".github/workflows/postgres-saas.yml"
      - "internal/saas/**"
      - "cmd/pdv-saas/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
  pull_request:
    paths:
      - "migrations/postgres/**"
      - ".github/workflows/postgres-saas.yml"
      - "internal/saas/**"
      - "cmd/pdv-saas/**"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: markys_test
          POSTGRES_PASSWORD: markys_test_password
          POSTGRES_DB: markys_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U markys_test -d markys_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://markys_test:markys_test_password@localhost:5432/markys_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: Resolve Go dependencies and generate checksums
        run: go mod tidy
      - name: Run SaaS and PostgreSQL integration tests
        run: go test ./internal/saas -v
      - name: Compile SaaS server
        run: go test ./cmd/pdv-saas -v
      - name: Build Linux SaaS container image
        run: docker build --pull -t markys-pdv-saas:test .
      - name: Validate SaaS interface JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path("cmd/pdv-saas/web/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b[^>]*>(.*?)</script>", source, re.I | re.S)
          if not scripts:
              raise SystemExit("Nenhum bloco JavaScript encontrado na interface SaaS")
          Path("/tmp/markys-pdv-saas-ui.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/markys-pdv-saas-ui.js
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Verify license seats and single-session constraints
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/postgres/tests/0001_saas_access_foundation_test.sql
      - name: Verify tenant row-level security isolation
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/postgres/tests/0002_tenant_rls_isolation_test.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/postgres/tests/0003_tenant_commercial_data_test.sql
